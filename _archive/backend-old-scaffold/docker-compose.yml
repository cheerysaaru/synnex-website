services:
  postgres:
    image: postgres:16-alpine
    container_name: synnext-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: synnext
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - synnext_pgdata:/var/lib/postgresql/data

volumes:
  synnext_pgdata:
