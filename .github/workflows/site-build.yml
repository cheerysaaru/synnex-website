# Builds the website for https://synnex-technology.com and publishes the finished
# files to the "site-build" branch. CyberPanel pulls that branch into public_html,
# so the server only ever gets the built site (no source code, no backend files).
name: Build site for synnex-technology.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_BASE: /
          VITE_API_URL: https://api.synnex-technology.com/api
          # public Web3Forms form key: enquiries are emailed to hello@synnex-technology.com
          VITE_WEB3FORMS_KEY: be9f10b8-ecb7-4083-a895-0af2c573fe3e
      - name: Install the quotation tool (/admin/quotation)
        working-directory: quotation
        run: npm ci --no-audit --no-fund
      - name: Build the quotation tool
        working-directory: quotation
        run: npm run build
        env:
          VITE_API_URL: https://api.synnex-technology.com/api
      - name: Add the quotation tool to the site (served at /admin/quotation/)
        run: cp -r quotation/dist frontend/dist/quotation-app
      - name: Ready-made HTML for every public page, sitemap.xml and .htaccess
        working-directory: frontend
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python scripts/postbuild_seo.py dist
      - name: Publish to the site-build branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: site-build
          publish_dir: frontend/dist
          force_orphan: true
          commit_message: "Built site from ${{ github.sha }}"
